[project]
name = "eew-discord-bot"
version = "0.1.0"
description = "Taiwan earthquake alert Discord bot (formal report only, CSV source)"
readme = "Spec.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.9",
  "discord.py>=2.3",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "aiosqlite>=0.20",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
